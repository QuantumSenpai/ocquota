<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
<title id="title">ocquota — Your coding window, in bloom.</title><desc id="desc">A calm terminal with cherry petals falling beside stable usage statistics. Sample data: 37.2 percent of a local budget. Thirteen themes and ten controllable ambient scenes.</desc>
<defs><clipPath id="canopy"><rect x="700" y="75" width="495" height="36"/></clipPath></defs><style>.petal{animation:fall 11s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes fall{0%{transform:translate(20px,-90px) rotate(-15deg);opacity:0}15%{opacity:.8}85%{opacity:.6}100%{transform:translate(-55px,160px) rotate(150deg);opacity:0}}@media(prefers-reduced-motion:reduce){.petal{animation:none;opacity:.5}}text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}</style>
